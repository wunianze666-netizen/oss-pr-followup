[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oss-pr-followup"
dynamic = ["version"]
description = "Triage and report open GitHub pull requests across repositories."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Nianze Wu" }]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
keywords = ["github", "pull-request", "open-source", "triage", "cli"]

[project.urls]
Homepage = "https://github.com/wunianze666-netizen/oss-pr-followup"
Issues = "https://github.com/wunianze666-netizen/oss-pr-followup/issues"

[project.scripts]
oss-pr-followup = "oss_pr_followup:main"

[tool.setuptools]
py-modules = ["oss_pr_followup"]
package-dir = { "" = "src" }

[tool.setuptools.dynamic]
version = { attr = "oss_pr_followup.VERSION" }
